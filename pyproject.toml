[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctomind"
version = "0.1.0"
description = "Draw a mind map from a YAML file: browse it in the terminal, or export it as ASCII, PNG, or SVG."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "svgwrite>=1.4",
]

[project.scripts]
ctomind = "ctomind:cli"

[tool.setuptools]
py-modules = ["ctomind"]
